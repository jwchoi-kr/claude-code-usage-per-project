[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccupp"
version = "0.2.1"
description = "Claude Code usage-per-project status line and tracker"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
keywords = ["claude", "claude-code", "ai", "usage", "status-line"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.scripts]
ccupp = "ccupp:main"

[tool.setuptools]
py-modules = [
    "ccupp",
    "ccupp_core",
    "ccupp_status_line",
    "ccupp_report",
    "ccupp_daily",
    "ccupp_model",
    "ccupp_all",
    "ccupp_export",
]
